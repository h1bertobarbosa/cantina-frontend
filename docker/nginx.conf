server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # HTML sem cache: novas versões sao baixadas imediatamente
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome (Vue CLI gera em /js/, /css/, /img/)
    # podem ser cacheados "para sempre": o hash muda a cada build
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
